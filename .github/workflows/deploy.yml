name: Deploy React + Vite to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v1  # ตรงนี้ต้องมี "-pages"
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2